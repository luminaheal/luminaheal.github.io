<style>
    :root {
        --primary-color: #4a6b5d;
        --secondary-color: #f0f4f1;
        --accent-color: #88a795;
        --text-color: #2d3732;
        --bg-color: #f9fbdf;
        --card-bg: #ffffff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.8;
        color: var(--text-color);
        background-color: #f7f9f8;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #4a6b5d;
        color: white;
        text-align: center;
        padding: 3.5rem 1rem 2.5rem;
        position: relative;
    }

    .lang-switch {
        position: absolute;
        top: 1.2rem;
        right: 1.2rem;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 0.4rem 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .lang-switch:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    header h1 {
        margin: 0;
        font-size: 2.1rem;
        font-weight: 500;
        letter-spacing: 2px;
    }

    header p {
        margin-top: 0.5rem;
        opacity: 0.85;
        font-size: 1rem;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
    }

    section {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 2.2rem;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.4rem;
        margin-top: 0;
        position: relative;
        padding-left: 0.8rem;
        border-left: 4px solid var(--accent-color);
    }

    ul {
        padding-left: 1.2rem;
    }

    li {
        margin-bottom: 0.5rem;
    }

    .price-card {
        background: var(--secondary-color);
        padding: 1.5rem;
        margin: 1rem 0;
        border-radius: 12px;
    }

    .price-card h3 {
        margin-top: 0;
        color: var(--primary-color);
    }

    .faq-item {
        margin-bottom: 1.5rem;
    }

    .faq-item h3 {
        color: var(--primary-color);
        font-size: 1.05rem;
        margin-bottom: 0.4rem;
    }

    footer {
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        color: #788c80;
        background-color: #edf2ef;
    }
</style>
