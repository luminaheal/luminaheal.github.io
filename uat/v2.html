<style>
    :root {
        --primary-color: #2b3a4a;
        --accent-color: #d4af37;
        --secondary-color: #f0f4f8;
        --text-color: #2c3e50;
        --bg-color: #f7fafc;
        --card-bg: #ffffff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.8;
        color: var(--text-color);
        background-color: var(--bg-color);
        margin: 0;
        padding: 0;
    }

    header {
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        color: #f8fafc;
        text-align: center;
        padding: 4rem 1rem 3rem;
        position: relative;
        border-bottom: 3px solid var(--accent-color);
    }

    .lang-switch {
        position: absolute;
        top: 1.2rem;
        right: 1.2rem;
        background: transparent;
        border: 1px solid var(--accent-color);
        color: var(--accent-color);
        padding: 0.4rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.3s ease;
    }

    .lang-switch:hover {
        background: var(--accent-color);
        color: #1e293b;
    }

    header h1 {
        margin: 0;
        font-size: 2.3rem;
        letter-spacing: 3px;
        color: #ffffff;
    }

    header p {
        margin-top: 0.6rem;
        color: #cbd5e1;
        font-size: 1.1rem;
        letter-spacing: 1px;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
    }

    section {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 2.2rem;
        margin-bottom: 2rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        border: 1px solid #e2e8f0;
    }

    h2 {
        color: var(--primary-color);
        border-bottom: 2px solid var(--accent-color);
        padding-bottom: 0.6rem;
        margin-top: 0;
        font-size: 1.45rem;
        display: inline-block;
    }

    ul {
        padding-left: 1.2rem;
    }

    li {
        margin-bottom: 0.6rem;
    }

    .price-card {
        background: var(--secondary-color);
        border-top: 3px solid var(--primary-color);
        padding: 1.5rem;
        margin: 1.2rem 0;
        border-radius: 8px;
    }

    .price-card h3 {
        margin-top: 0;
        color: var(--primary-color);
    }

    .faq-item {
        margin-bottom: 1.8rem;
        border-bottom: 1px dashed #cbd5e1;
        padding-bottom: 1rem;
    }

    .faq-item:last-child {
        border-bottom: none;
    }

    .faq-item h3 {
        color: var(--primary-color);
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
    }

    footer {
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        color: #64748b;
        background-color: #e2e8f0;
    }
</style>
