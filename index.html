<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光之疗愈 · 灵摆疗愈与能量调频</title>
    <style>
        :root {
            --primary-color: #8A73B9;
            --secondary-color: #D4AF37;
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-color: #4A4A4A;
            --light-text: #7A7A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            padding-bottom: 80px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Lang Toggle Button in Top Right */
        .lang-toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .lang-btn {
            background: #FFFFFF;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(138, 115, 185, 0.12);
        }

        .lang-btn:hover {
            background: var(--primary-color);
            color: #FFFFFF;
        }

        /* Header / Banner */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #F3EDF8 0%, #FFFDF9 100%);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(138, 115, 185, 0.08);
        }

        .hero h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .hero p {
            color: var(--light-text);
            font-size: 0.95rem;
        }

        /* Card Section */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        .card h2 {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #F0EAE1;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            background: #F3EDF8;
            color: var(--primary-color);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        ul.service-list {
            list-style: none;
            padding-left: 0;
        }

        ul.service-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        ul.service-list li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: var(--secondary-color);
        }

        /* Pricing Card Special Styling */
        .pricing-item {
            background: #FAF8F5;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .pricing-item h3 {
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .price-tag {
            font-weight: bold;
            color: #2D2D2D;
            margin-bottom: 6px;
        }
